[package]
name = "gls"
version = "0.1.0"
edition = "2021"
description = "ls, with pictures: an ls-style lister that shows thumbnails of images, videos and PDFs in your terminal (Sixel / Kitty / iTerm2, half blocks, ASCII art)"
license = "MIT"
repository = "https://github.com/equinox79/gls"
readme = "README.md"
keywords = ["cli", "image", "terminal", "thumbnail", "sixel"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
glob = "0.3"
crossterm = "0.28"
rayon = "1"
resvg = { version = "0.45", default-features = false }
regex = "1"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
color_quant = "1.1"
jpeg-decoder = "0.3"
unicode-width = "0.2"
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSURL"] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "bitflags", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
serde_json = "1"

